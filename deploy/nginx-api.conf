# /etc/nginx/sites-available/dakar-api  (puis lien symbolique dans sites-enabled)
# Remplace api.ton-domaine.com par ton sous-domaine. Certbot ajoutera lui-même le bloc HTTPS (443).
server {
    listen 80;
    server_name api.ton-domaine.com;

    # Photos limitées à 5 Mo par le backend : on laisse un peu de marge pour le formulaire
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
